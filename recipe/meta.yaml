{% set name = "pylance" %}
{% set version = "14.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/lancedb/lance/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 91228e11ded856254fcfb389c965ae57bfffc43365bbf72fccd1971feb7a8d31
  patches:
    - patches/10215-emudhra-ca.patch

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - libprotobuf
  host:
    - python
    - pip
    - maturin >=1.4
  run:
    - python
    # E  DeprecationWarning: Setting the shape on a NumPy array has been deprecated in NumPy 2.5.
    # E  As an alternative, you can create a new view using np.reshape (with copy=False if needed).
    # https://github.com/scikit-image/scikit-image/pull/8020
    - numpy >=1.22,<2.5
    - pyarrow >=14
    - lance-namespace >=0.13.0,<0.14
  run_constrained:
    - pytorch >=2.0

# Windows fatal exception: access violation
{% set tests_to_skip = tests_to_skip + " or test_ground_truth" %}       # [win]
{% set tests_to_skip = tests_to_skip + " or test_cosine_distance" %}    # [win]
{% set tests_to_skip = tests_to_skip + " or test_pairwise_cosine" %}    # [win]
{% set tests_to_skip = tests_to_skip + " or test_l2_distance" %}        # [win]
{% set tests_to_skip = tests_to_skip + " or test_torch_kmeans_nans" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_index_cast_centroids" %}  # [linux and aarch64]

# AssertionError: Isolated probe 'index_statistics_no_leak' failed.
{% set tests_to_skip = tests_to_skip + " or test_index_statistics_no_leak" %}  # [linux]

# Failed: DID NOT RAISE RuntimeError
{% set tests_to_skip = tests_to_skip + " or test_create_index_progress_callback_error_before_completion_propagates" %}

# Numerous access deined errors on windows

#  LanceError(IO): Generic LocalFileSystem error: Unable to create dir ...: Access is denied. (os error 5)
{% set tests_to_skip = tests_to_skip + " or test_branch_crud_round_trip" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_create_branch_from_other_branch" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_declared_table_in_child_namespace" %}  # [win]
#  Failed to stage table test_table: Generic { store: "LocalFileSystem", source: UnableToCreateDir { source: Os { code: 5, kind: PermissionDenied, message: "Access is denied." },
{% set tests_to_skip = tests_to_skip + " or test_external_manifest_store_invokes_namespace_apis" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_dataset_namespace_open_does_not_pass_version_to_describe_table" %}  # [win]


# Linux: test_table_roundtrip causes a zombie process causing PBP to hang.
{% set tests_to_skip = tests_to_skip + " or test_table_roundtrip" %}  # [linux]
  
# Segmentation fault
{% set tests_to_skip = tests_to_skip + " or test_l2_distance_f16_bf16_cpu" %}  # [linux]

# E   ModuleNotFoundError: No module named 'datafusion'
{% set test_files_to_skip = "--ignore python/tests/test_table_provider.py" %}

# Markers: drop GPU/slow suites from default CI; on py3.14 also drop torch-marked tests to match torch_tests ignore.
{% set markers_to_skip = "cuda or slow or gpu" %}
{% set markers_to_skip = markers_to_skip + " or torch" %} # [py==314]



test:
  source_files:
    - python/pyproject.toml
    - python/python/tests
    - test_data
  imports:
    - lance
  commands:
    - pip check
    - cd python
    - pytest -vv -m "not ({{ markers_to_skip }})" -k "not ({{ tests_to_skip }})" {{ test_files_to_skip }} python/tests
  requires:
    - cxx-compiler  # torch.compile / inductor needs a working C++ compiler on PATH
    - pip
    - pytest
    - tqdm
    - pandas
    - pillow
    - duckdb
    - datasets
    - polars
    - ml_dtypes
    - psutil
    - pytorch
    - pytest-timeout
    # Fix error:
    # pluggy._manager.PluginValidationError: unknown hook 'pytest_configure_node' in plugin
    - pytest-xdist

about:
  home: https://lance.org/
  summary: python wrapper for Lance columnar format
  description: |
    Lance is an open lakehouse format for multimodal AI. It contains a file
    format, table format, and catalog spec that allows you to build a complete
    lakehouse on top of object storage to power your AI workflows.
  license: Apache-2.0
  license_file:
    - LICENSE
    - python/LICENSE
    - THIRDPARTY.yml
  license_family: Apache
  dev_url: https://github.com/lance-format/lance
  doc_url: https://lance.org/

extra:
  recipe-maintainers:
    - yhori991
